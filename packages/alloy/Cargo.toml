[package]
name = "ens-tests-alloy"
version = "0.1.0"
edition = "2021"

[[test]]
name = "resolution"
harness = false

[dependencies]
alloy = { version = "1.8", features = ["ens", "provider-http"] }
alloy-ens = { version = "1.8", features = ["provider"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
