[package]
name = "ens-tests-alloy"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
alloy = { version = "2.3.0", features = ["ens"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
